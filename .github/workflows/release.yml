name: Release

# Tag a commit `vX.Y.Z` and push the tag; every module is published at that version.
on:
  push:
    tags: ['v*']

jobs:
  deploy:
    runs-on: [self-hosted, cljs, docker]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: DeLaGuardo/setup-clojure@13
        with:
          cli: latest

      - name: Run tests
        run: |
          clojure -M:test -m shadow.cljs.devtools.cli compile test
          node target/node-tests.js

      - name: Derive version from tag
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Deploy every module to Clojars
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: clojure -T:build deploy-all
