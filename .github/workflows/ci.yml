name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - uses: DeLaGuardo/setup-clojure@13
        with:
          cli: latest

      - name: Cache Clojure dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            .cpcache
          key: cljdeps-${{ hashFiles('deps.edn', 'modules/*/deps.edn') }}
          restore-keys: cljdeps-

      - name: Run tests
        run: |
          clojure -M:test -m shadow.cljs.devtools.cli compile test
          node target/node-tests.js

      - name: Compile every public namespace
        run: clojure -M:test -m shadow.cljs.devtools.cli compile lib-check

      - name: Build all module jars
        run: clojure -T:build jar-all
